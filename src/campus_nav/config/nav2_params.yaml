local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: map
      robot_base_frame: nav_base_link
      use_sim_time: True
      rolling_window: True
      width: 15
      height: 15
      resolution: 0.1
      transform_tolerance: 1.0

      # Buggy geometric footprint (Length ~3.2m, Width ~1.6m)
      # Coordinates are [x, y] relative to base_link
      footprint: "[ [1.6, 0.8], [1.6, -0.8], [-1.6, -0.8], [-1.6, 0.8] ]"
      
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: raw_cloud
        raw_cloud:
          # Direct Gazebo 3D LiDAR scan in lidar_link frame
          # TF chain: map -> world -> base_footprint -> base_link -> lidar_link (complete)
          topic: /cloud
          data_type: PointCloud2
          sensor_frame: lidar_link
          expected_update_rate: 0.0
          max_obstacle_height: 2.2
          # Nav2 filters height AFTER transforming into map. The campus road
          # surface is at z=0.30m; exclude it and the 0.08m speed breakers,
          # while retaining the 0.45m-tall dog and pedestrian test obstacles.
          min_obstacle_height: 0.45
          obstacle_max_range: 8.0
          obstacle_min_range: 0.1
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          clearing: True
          marking: True



      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Exceed the padded footprint's 0.81m inscribed radius so MPPI has
        # a clearance gradient around obstacles instead of only lethal cells.
        inflation_radius: 1.2
        cost_scaling_factor: 4.0

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    odom_topic: "/odom"
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.5
      yaw_goal_tolerance: 0.8
      stateful: True

    # MPPI Controller — used for dynamic obstacle evasion
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 45
      model_dt: 0.05
      batch_size: 600
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 1.8
      vx_min: 0.0
      wz_max: 1.2
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 1.5
      az_max: 2.0
      iteration_count: 1
      prune_distance: 3.0
      transform_tolerance: 1.0

      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false

      AckermannConstraints:
        min_turning_r: 1.2

      critics:
        - "ConstraintCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "ObstaclesCritic"
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        threshold_to_consider: 0.4
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        mode: 0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 3.0
        critical_weight: 6.0
        consider_footprint: true
        collision_cost: 2000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
